{% load static %}

<section class="trusted-partners-section">
  <div class="premium-container">
    <div class="trusted-partners-header">
      <p class="premium-eyebrow">Supplier Partnerships</p>
      <h2 class="premium-heading">Our Trusted Industry Associations and Partners</h2>
      <p>Recognized travel, tourism, and distribution relationships that support reliable corporate travel, supplier access, and destination delivery.</p>
    </div>
    <div class="trusted-partners-grid" aria-label="Trusted industry associations and partners">
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/iata.jpg' %}" alt="IATA logo">
      </article>
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/kata.jpg' %}" alt="Kenya Association of Travel Agents logo">
      </article>
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/kato.jpg' %}" alt="Kenya Association of Tour Operators logo">
      </article>
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/radius-travel.jpg' %}" alt="Radius Travel logo">
      </article>
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/atta.jpg' %}" alt="African Travel and Tourism Association logo">
      </article>
      <article class="trusted-partner-card">
        <img src="{% static 'images/partners/galileo.jpg' %}" alt="Galileo by Travelport logo">
      </article>
    </div>
  </div>
</section>
