services:
  - type: web
    name: Mscope
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: multiscope-travel.onrender.com,multiscopetravel.com,www.multiscopetravel.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mscope.onrender.com,https://multiscopetravel.com,https://www.multiscopetravel.com
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        sync: false
